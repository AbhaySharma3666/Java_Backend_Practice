<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Marks List</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        .header { background: #333; color: white; padding: 15px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #333; color: white; }
        .btn { padding: 8px 15px; background: #007bff; color: white; text-decoration: none; border-radius: 3px; }
    </style>
</head>
<body>

<div class="header">
    <h1>Marks List</h1>
    <a href="/admin/marks/add" class="btn">Add Marks</a>
</div>

<table>
    <thead>
        <tr>
            <th>Student</th>
            <th>Subject</th>
            <th>Exam</th>
            <th>Marks</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="m : ${marksList}">
            <td th:text="${m.student.name}"></td>
            <td th:text="${m.subject.name}"></td>
            <td th:text="${m.exam.name}"></td>
            <td th:text="${m.marks}"></td>
        </tr>
    </tbody>
</table>

<a href="/admin/dashboard">← Back to Dashboard</a>

</body>
</html>
