<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Timetable</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        .header { background: #333; color: white; padding: 15px; margin-bottom: 20px; }
        .form-section { background: #f4f4f4; padding: 20px; margin-bottom: 20px; border-radius: 5px; }
        input, select { padding: 8px; margin: 5px; }
        button { padding: 10px 20px; background: #28a745; color: white; border: none; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #333; color: white; }
        .delete-btn { background: #dc3545; color: white; padding: 5px 10px; text-decoration: none; border-radius: 3px; }
    </style>
</head>
<body>

<div class="header">
    <h1>Timetable Management</h1>
</div>

<div class="form-section">
    <h3>Add Schedule</h3>
    <form th:action="@{/admin/timetable/save}" method="post">
        <select name="subject.id" required>
            <option value="">Select Subject</option>
            <option th:each="s : ${subjects}" th:value="${s.id}" th:text="${s.name}"></option>
        </select>
        <select name="day" required>
            <option value="Monday">Monday</option>
            <option value="Tuesday">Tuesday</option>
            <option value="Wednesday">Wednesday</option>
            <option value="Thursday">Thursday</option>
            <option value="Friday">Friday</option>
        </select>
        <input type="time" name="startTime" required/>
        <input type="time" name="endTime" required/>
        <button type="submit">Add</button>
    </form>
</div>

<h3>Schedule</h3>
<table>
    <thead>
        <tr>
            <th>Subject</th>
            <th>Day</th>
            <th>Start Time</th>
            <th>End Time</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="t : ${timetables}">
            <td th:text="${t.subject?.name}">Math</td>
            <td th:text="${t.day}">Monday</td>
            <td th:text="${t.startTime}">09:00</td>
            <td th:text="${t.endTime}">10:00</td>
            <td><a th:href="@{/admin/timetable/delete/{id}(id=${t.id})}" class="delete-btn">Delete</a></td>
        </tr>
    </tbody>
</table>

<a href="/admin/dashboard">← Back</a>

</body>
</html>
