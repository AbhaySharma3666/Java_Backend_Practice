<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reports & Analytics</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        .header { background: #333; color: white; padding: 15px; margin-bottom: 20px; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin: 20px 0; }
        .stat-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 25px; border-radius: 10px; text-align: center; }
        .stat-card h3 { margin: 0 0 10px 0; }
        .stat-card .number { font-size: 36px; font-weight: bold; }
        .report-links { margin: 20px 0; }
        .report-links a { display: inline-block; padding: 15px 30px; background: #007bff; color: white; text-decoration: none; margin: 10px; border-radius: 5px; }
    </style>
</head>
<body>

<div class="header">
    <h1>Reports & Analytics</h1>
</div>

<div class="stats">
    <div class="stat-card">
        <h3>Total Students</h3>
        <div class="number" th:text="${totalStudents}">0</div>
    </div>
    <div class="stat-card" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
        <h3>Attendance Records</h3>
        <div class="number" th:text="${totalAttendance}">0</div>
    </div>
    <div class="stat-card" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
        <h3>Marks Entries</h3>
        <div class="number" th:text="${totalMarks}">0</div>
    </div>
    <div class="stat-card" style="background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);">
        <h3>Pending Fees</h3>
        <div class="number" th:text="${pendingFees}">0</div>
    </div>
</div>

<div class="report-links">
    <h3>Generate Reports</h3>
    <a href="/admin/reports/attendance">Attendance Report</a>
    <a href="/admin/reports/marks">Marks Report</a>
    <a href="/admin/students">Student List</a>
    <a href="/admin/fees">Fee Report</a>
</div>

<a href="/admin/dashboard">← Back</a>

</body>
</html>
