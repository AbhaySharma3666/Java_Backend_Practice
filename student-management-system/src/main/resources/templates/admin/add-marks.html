<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Marks</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        .header { background: #333; color: white; padding: 15px; margin-bottom: 20px; }
        .form-section { background: #f4f4f4; padding: 20px; border-radius: 5px; }
        select, input, button { padding: 10px; margin: 10px 5px; }
        button { background: #28a745; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

<div class="header">
    <h1>Add Marks</h1>
</div>

<div class="form-section">
    <form th:action="@{/admin/marks/save}" method="post">
        <select name="student.id" required>
            <option value="">Select Student</option>
            <option th:each="s : ${students}" th:value="${s.id}" th:text="${s.name}"></option>
        </select>
        <select name="subject.id" required>
            <option value="">Select Subject</option>
            <option th:each="sub : ${subjects}" th:value="${sub.id}" th:text="${sub.name}"></option>
        </select>
        <select name="exam.id" required>
            <option value="">Select Exam</option>
            <option th:each="e : ${exams}" th:value="${e.id}" th:text="${e.name}"></option>
        </select>
        <input type="number" name="marks" placeholder="Marks" min="0" max="100" required/>
        <button type="submit">Save</button>
    </form>
</div>

<a href="/admin/marks">← Back</a>

</body>
</html>
