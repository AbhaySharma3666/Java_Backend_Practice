<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Panel</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<div class="container-fluid">
    <div class="row">

        <!-- SIDEBAR -->
        <nav class="col-md-2 bg-dark min-vh-100 p-3">
            <h4 class="text-white">Admin</h4>
            <hr class="text-light">

            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link text-white" href="/admin/dashboard">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="/admin/students">Students</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="/admin/departments">Departments</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="/admin/courses">Courses</a>
                </li>
                <li class="nav-item mt-3">
                    <a class="nav-link text-danger" href="/logout">Logout</a>
                </li>
            </ul>
        </nav>

        <!-- MAIN CONTENT -->
        <main class="col-md-10 p-4">
            <!-- Content will be injected here -->
            <div th:replace="${content}"></div>
        </main>

    </div>
</div>

</body>
</html>
