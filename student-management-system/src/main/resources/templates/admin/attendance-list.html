<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Attendance List</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        .header { background: #333; color: white; padding: 15px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #333; color: white; }
        .present { color: green; }
        .absent { color: red; }
    </style>
</head>
<body>

<div class="header">
    <h1>Attendance Records</h1>
</div>

<a href="/admin/attendance/mark" style="display: inline-block; padding: 10px 20px; background: #28a745; color: white; text-decoration: none; border-radius: 5px; margin-bottom: 20px;">Mark Attendance</a>

<table>
    <thead>
        <tr>
            <th>Date</th>
            <th>Student</th>
            <th>Subject</th>
            <th>Status</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="a : ${attendanceList}">
            <td th:text="${a.date}">2024-01-15</td>
            <td th:text="${a.student?.name}">John</td>
            <td th:text="${a.subject?.name}">Math</td>
            <td th:class="${a.status == 'Present' ? 'present' : 'absent'}" th:text="${a.status}">Present</td>
        </tr>
        <tr th:if="${#lists.isEmpty(attendanceList)}">
            <td colspan="4" style="text-align: center;">No records found</td>
        </tr>
    </tbody>
</table>

<a href="/admin/dashboard">← Back</a>

</body>
</html>
