<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Fee Receipt</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        .receipt-container { max-width: 600px; margin: 0 auto; border: 2px solid #333; padding: 30px; }
        .header { text-align: center; border-bottom: 2px solid #333; padding-bottom: 15px; margin-bottom: 20px; }
        .header h1 { margin: 0; font-size: 24px; }
        .header p { margin: 5px 0; color: #666; }
        .details-table { width: 100%; margin: 20px 0; }
        .details-table tr { border-bottom: 1px solid #ddd; }
        .details-table td { padding: 10px 5px; }
        .details-table td:first-child { font-weight: bold; width: 40%; }
        .footer { text-align: center; margin-top: 30px; padding-top: 15px; border-top: 2px solid #333; }
        .btn { padding: 10px 20px; background: #007bff; color: white; text-decoration: none; border-radius: 5px; display: inline-block; margin: 10px 5px; }
        .btn-success { background: #28a745; }
        @media print {
            .no-print { display: none; }
        }
    </style>
</head>
<body>

<div class="receipt-container">
    <div class="header">
        <h1>FEE RECEIPT</h1>
        <p>College Student Management System</p>
        <p>Receipt No: RCP-<span th:text="${fee.id}"></span></p>
    </div>

    <table class="details-table">
        <tr>
            <td>Date:</td>
            <td th:text="${#temporals.format(#temporals.createNow(), 'dd-MM-yyyy HH:mm')}"></td>
        </tr>
        <tr>
            <td>Student Name:</td>
            <td th:text="${fee.student.name}"></td>
        </tr>
        <tr>
            <td>Roll No:</td>
            <td th:text="${fee.student.rollNo}"></td>
        </tr>
        <tr>
            <td>Department:</td>
            <td th:text="${fee.student.department?.name ?: 'N/A'}"></td>
        </tr>
        <tr>
            <td>Fee Type:</td>
            <td th:text="${fee.feeType ?: 'General'}"></td>
        </tr>
        <tr>
            <td>Amount:</td>
            <td><strong>₹<span th:text="${fee.amount}"></span></strong></td>
        </tr>
        <tr>
            <td>Status:</td>
            <td th:text="${fee.status}"></td>
        </tr>
        <tr>
            <td>Due Date:</td>
            <td th:text="${fee.dueDate ?: 'N/A'}"></td>
        </tr>
    </table>

    <div class="footer">
        <p>Thank you for your payment!</p>
        <p style="font-size: 12px; color: #666;">This is a computer-generated receipt</p>
    </div>
</div>

<div style="text-align: center; margin-top: 20px;" class="no-print">
    <a th:href="@{/admin/fees/receipt/download/{id}(id=${fee.id})}" class="btn btn-success">Download PDF</a>
    <button onclick="window.print()" class="btn">Print Receipt</button>
    <a href="/admin/fees" class="btn">← Back to Fees</a>
</div>

</body>
</html>
