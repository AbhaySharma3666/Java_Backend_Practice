<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Subjects</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        .header { background: #333; color: white; padding: 15px; margin-bottom: 20px; }
        .form-section { background: #f4f4f4; padding: 20px; margin-bottom: 20px; border-radius: 5px; }
        input, select { padding: 8px; margin: 5px; width: 200px; }
        button { padding: 10px 20px; background: #28a745; color: white; border: none; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #333; color: white; }
        .delete-btn { background: #dc3545; color: white; padding: 5px 10px; text-decoration: none; border-radius: 3px; }
    </style>
</head>
<body>

<div class="header">
    <h1>Manage Subjects</h1>
</div>

<div class="form-section">
    <h3>Add New Subject</h3>
    <form th:action="@{/admin/subjects/save}" method="post">
        <input type="text" name="name" placeholder="Subject Name" required/>
        <select name="course.id" required>
            <option value="">Select Course</option>
            <option th:each="c : ${courses}" th:value="${c.id}" th:text="${c.name}"></option>
        </select>
        <select name="faculty.id">
            <option value="">Select Faculty (Optional)</option>
            <option th:each="f : ${faculties}" th:value="${f.id}" th:text="${f.name}"></option>
        </select>
        <button type="submit">Add Subject</button>
    </form>
</div>

<h3>All Subjects</h3>
<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Course</th>
            <th>Faculty</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="s : ${subjects}">
            <td th:text="${s.id}">1</td>
            <td th:text="${s.name}">Mathematics</td>
            <td th:text="${s.course?.name}">B.Tech CS</td>
            <td th:text="${s.faculty?.name}">Dr. Smith</td>
            <td><a th:href="@{/admin/subjects/delete/{id}(id=${s.id})}" class="delete-btn">Delete</a></td>
        </tr>
    </tbody>
</table>

<a href="/admin/dashboard">← Back to Dashboard</a>

</body>
</html>
