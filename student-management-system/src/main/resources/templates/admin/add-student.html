<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Student</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-4">
    <h3>Add / Edit Student</h3>

    <form th:action="@{/admin/students/save}" th:object="${student}" method="post">
        <input type="hidden" th:field="*{id}"/>

        <input class="form-control mb-2" th:field="*{rollNo}" placeholder="Roll No"/>
        <input class="form-control mb-2" th:field="*{name}" placeholder="Name"/>
        <input class="form-control mb-2" th:field="*{email}" placeholder="Email"/>
        <input class="form-control mb-2" th:field="*{phone}" placeholder="Phone"/>

        <button class="btn btn-primary">Save</button>
        <a href="/admin/students" class="btn btn-secondary">Back</a>
    </form>
</div>

</body>
</html>
